plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

android {
    namespace = "io.wisetrack.flutterapp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "io.wisetrack.flutterapp"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // play: Google Play build (io.wisetrack.sdk:core only, from the plugin).
    // other: builds for stores other than Google Play (core + core-tools and store add-ons).
    // Run with: flutter run --flavor play | flutter run --flavor other
    // Both flavors have the same applicationId (google-services.json has one client), so installing
    // one replaces the other and keeps its data: clear the app data when switching.
    flavorDimensions = ["store"]
    productFlavors {
        play {
            dimension = "store"
        }
        other {
            dimension = "store"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
    implementation 'com.google.firebase:firebase-installations:17.2.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'io.wisetrack.sdk:referrer:2.0.0'

    // Only in builds for stores other than Google Play. core-tools has no version: it gets the
    // core version of the plugin.
    otherImplementation 'io.wisetrack.sdk:core-tools'
    otherImplementation 'io.wisetrack.sdk:oaid:2.0.0'
    otherImplementation 'com.google.android.gms:play-services-appset:16.1.0'
    otherImplementation 'com.huawei.hms:ads-identifier:3.4.62.300'
    otherImplementation 'com.github.cafebazaar:referrersdk:1.1.1'
}

flutter {
    source = "../.."
}
