name: wisetrack
description: "WiseTrack provides advanced user tracking features for mobile apps."
version: 2.5.0

homepage: https://wisetrack.io
repository: https://github.com/wisetrack-io/flutter-sdk/
issue_tracker: https://github.com/wisetrack-io/flutter-sdk/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.3
  web: ">=0.5.1 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  mockito: ">=5.4.4 <6.0.0"
  build_runner: ">=2.4.9 <3.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: io.wisetrack.wisetrack
        pluginClass: WiseTrackPlugin
      ios:
        pluginClass: WisetrackPlugin
      web:
        pluginClass: WisetrackPlugin
        fileName: src/config/web/wisetrack_web.dart
